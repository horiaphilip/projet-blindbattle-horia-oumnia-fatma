spring.application.name=blindbattle
spring.profiles.active=local
server.port=8080
server.servlet.context-path=/api
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
logging.level.org.apache.activemq.audit=WARN
blindbattle.outbox.delay=1000
blindbattle.jms.prefix=
blindbattle.jwt.secret=${JWT_SECRET:blindbattle-dev-secret-change-me-in-production-2026}
blindbattle.jwt.ttl=PT8H
