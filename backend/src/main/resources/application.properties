spring.application.name=blindbattle
server.port=8080
server.servlet.context-path=/api
spring.datasource.url=jdbc:h2:file:./data/blindbattle
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.artemis.mode=embedded
spring.artemis.embedded.persistent=false
spring.artemis.embedded.queues=user.events
logging.level.org.apache.activemq.audit=WARN
blindbattle.outbox.delay=1000
