<nav class="navigation">
  <a class="logo" routerLink="">Blind<span>Battle</span></a>
  <div class="links">
    <a routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      >Accueil</a
    >
    <a routerLink="joueurs" routerLinkActive="active">Joueurs</a>
    <a routerLink="classement" routerLinkActive="active">Classement</a>
    <a routerLink="rejoindre" routerLinkActive="active">Rejoindre</a>
    @if (authService.currentUser(); as user) {
      <a routerLink="partie/nouvelle" routerLinkActive="active">Créer une partie</a>
      <a routerLink="mes-quiz" routerLinkActive="active">Mes quiz</a>
      <a routerLink="profil" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        >Mon profil</a
      >
      <span class="user-name">{{ user.name }}</span>
      <button class="button secondary" type="button" (click)="logout()">Déconnexion</button>
    } @else {
      <a routerLink="connexion" routerLinkActive="active">Connexion</a>
      <a class="button" routerLink="inscription">Créer un compte</a>
    }
  </div>
</nav>
